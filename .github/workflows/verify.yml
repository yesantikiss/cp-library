name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .verify-helper/requirements.txt
      - name: Install verification-helper
        run: python -m pip install -r .verify-helper/requirements.txt
      - name: Verify library
        run: oj-verify all
      - name: Generate documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: oj-verify docs
      - name: Upload documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: .verify-helper/markdown
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: .verify-helper/markdown
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .verify-helper/markdown
          enable_jekyll: true
