name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .verify-helper/requirements.txt
      - name: Install verification-helper
        run: python -m pip install -r .verify-helper/requirements.txt
      - name: Verify library
        run: oj-verify all
